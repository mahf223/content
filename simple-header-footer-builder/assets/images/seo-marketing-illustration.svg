<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <filter id="shadow-sm" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-md" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1FBBE8"/>
      <stop offset="100%" stop-color="#17a5d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#F5F5F5" rx="0"/>

  <!-- Main Browser Window -->
  <g filter="url(#shadow-lg)">
    <rect x="80" y="50" width="440" height="320" rx="8" fill="#FFFFFF"/>
    <!-- Browser Top Bar -->
    <rect x="80" y="50" width="440" height="36" rx="8" fill="#E0E0E0"/>
    <rect x="80" y="78" width="440" height="8" fill="#E0E0E0"/>
    <!-- Browser dots -->
    <circle cx="100" cy="68" r="5" fill="#FF6B6B"/>
    <circle cx="116" cy="68" r="5" fill="#FFD93D"/>
    <circle cx="132" cy="68" r="5" fill="#6BCB77"/>
    <!-- URL bar -->
    <rect x="152" y="58" width="280" height="20" rx="10" fill="#FFFFFF"/>
  </g>

  <!-- Browser Content: Search Bar UI Element -->
  <rect x="120" y="105" width="360" height="32" rx="16" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <circle cx="140" cy="121" r="8" fill="none" stroke="#1FBBE8" stroke-width="2"/>
  <line x1="146" y1="127" x2="150" y2="131" stroke="#1FBBE8" stroke-width="2" stroke-linecap="round"/>

  <!-- Browser Content: Bar Chart -->
  <g filter="url(#shadow-sm)">
    <rect x="110" y="155" width="180" height="120" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Chart bars -->
    <rect x="130" y="225" width="16" height="30" rx="3" fill="#E0E0E0"/>
    <rect x="154" y="205" width="16" height="50" rx="3" fill="#E0E0E0"/>
    <rect x="178" y="195" width="16" height="60" rx="3" fill="#1FBBE8"/>
    <rect x="202" y="210" width="16" height="45" rx="3" fill="#1FBBE8" opacity="0.7"/>
    <rect x="226" y="185" width="16" height="70" rx="3" fill="#1FBBE8"/>
    <rect x="250" y="200" width="16" height="55" rx="3" fill="#1FBBE8" opacity="0.7"/>
    <!-- Chart baseline -->
    <line x1="120" y1="255" x2="280" y2="255" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Chart grid lines -->
    <line x1="120" y1="235" x2="280" y2="235" stroke="#F5F5F5" stroke-width="0.5"/>
    <line x1="120" y1="215" x2="280" y2="215" stroke="#F5F5F5" stroke-width="0.5"/>
    <line x1="120" y1="195" x2="280" y2="195" stroke="#F5F5F5" stroke-width="0.5"/>
  </g>

  <!-- Browser Content: Line Graph -->
  <g filter="url(#shadow-sm)">
    <rect x="305" y="155" width="195" height="120" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
    <!-- Grid lines -->
    <line x1="320" y1="190" x2="485" y2="190" stroke="#F5F5F5" stroke-width="0.5"/>
    <line x1="320" y1="215" x2="485" y2="215" stroke="#F5F5F5" stroke-width="0.5"/>
    <line x1="320" y1="240" x2="485" y2="240" stroke="#F5F5F5" stroke-width="0.5"/>
    <!-- Line graph path -->
    <polyline points="320,245 340,235 360,220 380,225 400,200 420,190 440,195 460,175 480,170" fill="none" stroke="#1FBBE8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Data points -->
    <circle cx="320" cy="245" r="3" fill="#1FBBE8"/>
    <circle cx="360" cy="220" r="3" fill="#1FBBE8"/>
    <circle cx="400" cy="200" r="3" fill="#1FBBE8"/>
    <circle cx="440" cy="195" r="3" fill="#1FBBE8"/>
    <circle cx="480" cy="170" r="3" fill="#1FBBE8"/>
    <!-- Area fill under line -->
    <polygon points="320,245 340,235 360,220 380,225 400,200 420,190 440,195 460,175 480,170 480,255 320,255" fill="#1FBBE8" opacity="0.08"/>
  </g>

  <!-- Browser Content: UI Buttons -->
  <rect x="110" y="290" width="70" height="26" rx="13" fill="#1FBBE8"/>
  <rect x="190" y="290" width="70" height="26" rx="13" fill="#E0E0E0"/>
  <rect x="270" y="290" width="70" height="26" rx="13" fill="#F5F5F5" stroke="#1FBBE8" stroke-width="1.5"/>

  <!-- Browser Content: Toggle switches -->
  <g>
    <rect x="370" y="292" width="36" height="18" rx="9" fill="#1FBBE8"/>
    <circle cx="397" cy="301" r="7" fill="#FFFFFF"/>
  </g>
  <g>
    <rect x="420" y="292" width="36" height="18" rx="9" fill="#E0E0E0"/>
    <circle cx="429" cy="301" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Browser Content: Progress indicators -->
  <rect x="110" y="335" width="180" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="110" y="335" width="120" height="6" rx="3" fill="#1FBBE8"/>
  <rect x="110" y="350" width="180" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="110" y="350" width="85" height="6" rx="3" fill="#1FBBE8" opacity="0.6"/>

  <!-- Right Side: Large Magnifying Glass -->
  <g filter="url(#shadow-md)" transform="translate(580, 80)">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#1FBBE8" stroke-width="8"/>
    <circle cx="60" cy="60" r="38" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Magnifying glass handle -->
    <line x1="95" y1="95" x2="130" y2="130" stroke="#1FBBE8" stroke-width="10" stroke-linecap="round"/>
    <!-- Inside magnifying glass: mini chart -->
    <rect x="40" y="55" width="8" height="22" rx="2" fill="#1FBBE8" opacity="0.5"/>
    <rect x="52" y="45" width="8" height="32" rx="2" fill="#1FBBE8" opacity="0.7"/>
    <rect x="64" y="50" width="8" height="27" rx="2" fill="#1FBBE8"/>
    <rect x="76" y="40" width="8" height="37" rx="2" fill="#1FBBE8" opacity="0.8"/>
  </g>

  <!-- Right Side: Analytics Card -->
  <g filter="url(#shadow-md)">
    <rect x="560" y="240" width="180" height="100" rx="8" fill="#FFFFFF"/>
    <!-- Mini donut chart -->
    <circle cx="600" cy="290" r="25" fill="none" stroke="#E0E0E0" stroke-width="8"/>
    <circle cx="600" cy="290" r="25" fill="none" stroke="#1FBBE8" stroke-width="8" stroke-dasharray="110 47" stroke-linecap="round" transform="rotate(-90 600 290)"/>
    <!-- Stats lines -->
    <rect x="640" y="272" width="80" height="6" rx="3" fill="#E0E0E0"/>
    <rect x="640" y="286" width="60" height="6" rx="3" fill="#1FBBE8" opacity="0.6"/>
    <rect x="640" y="300" width="70" height="6" rx="3" fill="#E0E0E0"/>
    <!-- Upward arrow indicator -->
    <polygon points="660,260 665,252 670,260" fill="#1FBBE8"/>
  </g>

  <!-- Right Side: Small KPI Card -->
  <g filter="url(#shadow-sm)">
    <rect x="560" y="360" width="85" height="70" rx="6" fill="#FFFFFF"/>
    <!-- Sparkline -->
    <polyline points="572,410 580,400 590,405 600,395 610,390 620,385 632,378" fill="none" stroke="#1FBBE8" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Indicator dot -->
    <circle cx="632" cy="378" r="3" fill="#1FBBE8"/>
    <!-- Placeholder bars -->
    <rect x="572" y="372" width="50" height="5" rx="2.5" fill="#E0E0E0"/>
  </g>

  <!-- Right Side: Second KPI Card -->
  <g filter="url(#shadow-sm)">
    <rect x="655" y="360" width="85" height="70" rx="6" fill="#FFFFFF"/>
    <!-- Pie mini -->
    <circle cx="697" cy="395" r="15" fill="#E0E0E0"/>
    <path d="M697,395 L697,380 A15,15 0 0,1 710,400 Z" fill="#1FBBE8"/>
    <!-- Placeholder line -->
    <rect x="667" y="418" width="60" height="5" rx="2.5" fill="#E0E0E0"/>
  </g>

  <!-- Floating Elements: Gear Icon -->
  <g filter="url(#shadow-sm)" transform="translate(45, 400)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="8" fill="none" stroke="#1FBBE8" stroke-width="2"/>
    <g stroke="#1FBBE8" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="5" x2="20" y2="9"/>
      <line x1="20" y1="31" x2="20" y2="35"/>
      <line x1="5" y1="20" x2="9" y2="20"/>
      <line x1="31" y1="20" x2="35" y2="20"/>
      <line x1="9" y1="9" x2="12" y2="12"/>
      <line x1="28" y1="28" x2="31" y2="31"/>
      <line x1="9" y1="31" x2="12" y2="28"/>
      <line x1="28" y1="12" x2="31" y2="9"/>
    </g>
  </g>

  <!-- Floating Elements: Target/Bullseye -->
  <g filter="url(#shadow-sm)" transform="translate(30, 180)">
    <circle cx="22" cy="22" r="20" fill="#FFFFFF"/>
    <circle cx="22" cy="22" r="14" fill="none" stroke="#1FBBE8" stroke-width="2"/>
    <circle cx="22" cy="22" r="8" fill="none" stroke="#1FBBE8" stroke-width="2" opacity="0.6"/>
    <circle cx="22" cy="22" r="3" fill="#1FBBE8"/>
  </g>

  <!-- Floating Elements: Cursor/Pointer -->
  <g filter="url(#shadow-sm)" transform="translate(535, 150)">
    <path d="M10,5 L10,30 L16,24 L22,35 L26,33 L20,22 L28,22 Z" fill="#1FBBE8"/>
  </g>

  <!-- Floating Elements: Link Chain Icon -->
  <g filter="url(#shadow-sm)" transform="translate(540, 420)">
    <rect x="0" y="8" width="40" height="24" rx="12" fill="#FFFFFF"/>
    <path d="M12,16 A6,6 0 0,1 12,28" fill="none" stroke="#1FBBE8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28,16 A6,6 0 0,0 28,28" fill="none" stroke="#1FBBE8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="16" y1="22" x2="24" y2="22" stroke="#1FBBE8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating Elements: Globe/World Icon -->
  <g filter="url(#shadow-sm)" transform="translate(44, 290)">
    <circle cx="18" cy="18" r="16" fill="#FFFFFF"/>
    <circle cx="18" cy="18" r="12" fill="none" stroke="#1FBBE8" stroke-width="1.5"/>
    <ellipse cx="18" cy="18" rx="6" ry="12" fill="none" stroke="#1FBBE8" stroke-width="1.5"/>
    <line x1="6" y1="18" x2="30" y2="18" stroke="#1FBBE8" stroke-width="1"/>
    <line x1="18" y1="6" x2="18" y2="30" stroke="#1FBBE8" stroke-width="1"/>
  </g>

  <!-- Decorative dots pattern -->
  <circle cx="760" cy="60" r="3" fill="#1FBBE8" opacity="0.3"/>
  <circle cx="775" cy="60" r="3" fill="#1FBBE8" opacity="0.2"/>
  <circle cx="760" cy="75" r="3" fill="#1FBBE8" opacity="0.2"/>
  <circle cx="775" cy="75" r="3" fill="#1FBBE8" opacity="0.15"/>
  <circle cx="760" cy="90" r="3" fill="#1FBBE8" opacity="0.15"/>

  <!-- Decorative dots bottom left -->
  <circle cx="85" cy="460" r="2" fill="#1FBBE8" opacity="0.2"/>
  <circle cx="95" cy="460" r="2" fill="#1FBBE8" opacity="0.15"/>
  <circle cx="105" cy="460" r="2" fill="#1FBBE8" opacity="0.2"/>
  <circle cx="115" cy="460" r="2" fill="#1FBBE8" opacity="0.15"/>
  <circle cx="85" cy="472" r="2" fill="#1FBBE8" opacity="0.15"/>
  <circle cx="95" cy="472" r="2" fill="#1FBBE8" opacity="0.1"/>
  <circle cx="105" cy="472" r="2" fill="#1FBBE8" opacity="0.15"/>
  <circle cx="115" cy="472" r="2" fill="#1FBBE8" opacity="0.1"/>

  <!-- Floating accent shapes -->
  <rect x="755" y="460" width="20" height="20" rx="4" fill="#1FBBE8" opacity="0.1" transform="rotate(15 765 470)"/>
  <circle cx="740" cy="450" r="6" fill="#1FBBE8" opacity="0.12"/>
</svg>
